# =============================================================================
# RUN ISSUE BUILDER
# =============================================================================
# Generated: 2026-07-31 09:15 AM EDT
#
# Runs run_from_drive.py on a schedule, which downloads the working
# folder from Google Drive, runs build_issue_csv.py against it locally
# on the runner, and uploads back whatever's new or changed.
#
# SCHEDULE
# ----------------------------------------------------------------------------
#   Runs every day at 9:07am, 12:07pm, 3:07pm, 6:07pm, and 9:07pm Eastern.
#
# This uses GitHub's "timezone" field (added March 2026) to schedule
# directly in Eastern time, rather than doing UTC math by hand. GitHub
# automatically adjusts for daylight saving - no biannual hour
# adjustment needed anymore, unlike the very first version of this file.
#
# The schedule is offset to :07 past the hour rather than exactly on
# the hour. GitHub's own docs warn that scheduled runs can be delayed
# or, under high load, dropped entirely - and load is highest right at
# the top of every hour, since that's when the most schedules across
# all of GitHub fire at once. A few minutes' offset avoids that spike.
# Even so, GitHub gives no guaranteed exact-time SLA for scheduled
# runs - occasional delays of a few minutes are normal and not a sign
# of anything broken.
#
#
# MANUAL RUNS
# ----------------------------------------------------------------------------
# This workflow can also be triggered by hand from the Actions tab on
# GitHub (Actions -> Run Issue Builder -> Run workflow), without
# waiting for the schedule - useful for testing changes.
# =============================================================================

name: Run Issue Builder

on:
  schedule:
    - cron: '7 9,12,15,18,21 * * *'
      timezone: "America/New_York"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run-issue-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account key to a temp file
        run: echo '${{ secrets.GDRIVE_SA_KEY }}' > "$RUNNER_TEMP/service_account.json"

      - name: Run run_from_drive.py
        env:
          GDRIVE_SA_KEY_FILE: ${{ runner.temp }}/service_account.json
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: python run_from_drive.py
