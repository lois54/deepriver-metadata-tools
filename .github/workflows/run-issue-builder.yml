# =============================================================================
# RUN ISSUE BUILDER
# =============================================================================
# Generated: 2026-07-28 01:20 PM EDT
#
# Runs run_from_drive.py on a schedule, which downloads the working
# folder from Google Drive, runs build_issue_csv.py against it locally
# on the runner, and uploads back whatever's new or changed.
#
# SCHEDULE (all times below are UTC - see the comments on each line)
# ----------------------------------------------------------------------------
#   Weekdays: every 30 minutes, 7am-11pm Eastern
#   Weekends: once an hour, same 7am-11pm Eastern window
#
# GitHub Actions cron always runs in UTC and has no concept of daylight
# saving time. The lines below are written for EDT (UTC-4), which is
# correct roughly mid-March through early November. When clocks fall
# back to EST (UTC-5) in early November, add 1 to each hour below; when
# they spring forward to EDT again in March, subtract 1. A day or two
# of drift right around the change itself isn't worth worrying about.
#
# MANUAL RUNS
# ----------------------------------------------------------------------------
# This workflow can also be triggered by hand from the Actions tab on
# GitHub (Actions -> Run Issue Builder -> Run workflow), without
# waiting for the schedule - useful for testing changes.
# =============================================================================

name: Run Issue Builder

on:
  schedule:
    # Weekdays (Mon-Fri), every 30 min, 7am-11pm Eastern (EDT = UTC-4)
    - cron: '0,30 11-23,0-3 * * 1-5'
    # Weekends (Sat-Sun), once an hour, same window
    - cron: '0 11-23,0-3 * * 0,6'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run-issue-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account key to a temp file
        run: echo '${{ secrets.GDRIVE_SA_KEY }}' > "$RUNNER_TEMP/service_account.json"

      - name: Run run_from_drive.py
        env:
          GDRIVE_SA_KEY_FILE: ${{ runner.temp }}/service_account.json
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: python run_from_drive.py
